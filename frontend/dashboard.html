<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Saldo</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="dashboard-header">
    <span class="logo">Saldo</span>
    <div class="header-right">
      <span id="user-email" class="user-email"></span>
      <button id="signout-btn" class="btn-ghost">Sign out</button>
    </div>
  </header>

  <main class="dashboard-main">

    <!-- Add Expense -->
    <section id="add-section" class="card">
      <h2>Add expense</h2>
      <div class="form-grid">
        <input type="number" id="input-amount" step="0.01" min="0" placeholder="0.00" />
        <select id="input-category">
          <option value="" disabled selected>Category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Subscriptions">Subscriptions</option>
          <option value="Night out">Night out</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>
        <input type="text" id="input-description" placeholder="What was it?" />
        <input type="date" id="input-date" />
        <button id="add-btn" class="btn-primary">Add expense</button>
      </div>
      <div id="add-message" class="add-message" hidden></div>
    </section>

    <!-- Weekly Insight -->
    <section id="insight-section" class="card">
      <h2>This week's insight</h2>
      <button id="insight-btn" class="btn-primary">Analyse my spending</button>
      <div id="insight-spinner" class="spinner" hidden></div>
      <div id="insight-box" class="insight-box" hidden>
        <div id="insight-text"></div>
        <div id="insight-breakdown" class="insight-breakdown"></div>
      </div>
    </section>

    <!-- Expenses List -->
    <section id="expenses-section" class="card">
      <h2>My expenses</h2>
      <div id="empty-state" class="empty-state" hidden>
        No expenses yet. Add your first one above.
      </div>
      <div id="expenses-list"></div>
    </section>

  </main>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
