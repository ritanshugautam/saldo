<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saldo</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-header">
      <h1>Saldo</h1>
      <p class="tagline">Track smarter. Spend less.</p>
    </div>

    <div class="auth-card">
      <!-- Sign Up Panel -->
      <div id="signup-panel">
        <h2>Create account</h2>
        <div class="form-group">
          <input type="text" id="signup-name" placeholder="Your name" autocomplete="name" />
        </div>
        <div class="form-group">
          <input type="email" id="signup-email" placeholder="Email address" autocomplete="email" />
        </div>
        <div class="form-group">
          <input type="password" id="signup-password" placeholder="Password (min 6 chars)" minlength="6" autocomplete="new-password" />
        </div>
        <div id="signup-error" class="error-msg" hidden></div>
        <button id="signup-btn" class="btn-primary">Create account</button>
        <p class="auth-toggle">Already have an account? <span id="show-login">Sign in</span></p>
      </div>

      <!-- Log In Panel -->
      <div id="login-panel" hidden>
        <h2>Sign in</h2>
        <div class="form-group">
          <input type="email" id="login-email" placeholder="Email address" autocomplete="email" />
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
        </div>
        <div id="login-error" class="error-msg" hidden></div>
        <button id="login-btn" class="btn-primary">Sign in</button>
        <p class="auth-toggle">New to Saldo? <span id="show-signup">Sign up</span></p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
